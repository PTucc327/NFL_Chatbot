name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        env:
          GEMINI_API_KEY: test-placeholder
        run: python -m pytest tests/ -q

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Run secrets scan
        # `scan --baseline` only rewrites the baseline and always exits 0;
        # the hook exits non-zero when a secret is not in the baseline.
        # UTF-8 mode: without it (e.g. on Windows) files with emoji such as
        # README.md are silently skipped. Run it the same way locally:
        #   git ls-files -z | PYTHONUTF8=1 xargs -0 detect-secrets-hook --baseline .secrets.baseline
        env:
          PYTHONUTF8: "1"
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  dependency-audit:
    name: Dependency CVE Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and pip-audit
        run: |
          pip install -r requirements-dev.txt
          pip install pip-audit==2.9.0

      - name: Run pip-audit
        # --strict fails the job on any known CVE; --desc adds vuln descriptions.
        # Remove --strict if you want warnings-only while still seeing the report.
        run: pip-audit -r requirements.txt -r requirements-dev.txt --desc --strict

  e2e:
    name: Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and Chromium
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Run browser tests
        # NFL_BOT_FAKE_LLM is set by the test fixtures: no API key or quota used.
        env:
          RUN_E2E: "1"
        run: python -m pytest tests/e2e -v

      - name: Upload app server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-app-server-log
          path: tests/e2e/app_server.log
