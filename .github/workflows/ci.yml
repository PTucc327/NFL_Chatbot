name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          GEMINI_API_KEY: test-placeholder
        run: python -m pytest tests/ -q

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Run secrets scan
        # `scan --baseline` only rewrites the baseline and always exits 0;
        # the hook exits non-zero when a secret is not in the baseline.
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  dependency-audit:
    name: Dependency CVE Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and pip-audit
        run: |
          pip install -r requirements.txt
          pip install pip-audit==2.9.0

      - name: Run pip-audit
        # --strict fails the job on any known CVE; --desc adds vuln descriptions.
        # Remove --strict if you want warnings-only while still seeing the report.
        run: pip-audit -r requirements.txt --desc --strict
